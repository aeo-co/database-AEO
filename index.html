<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Marketer — AI visibility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="/vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0C0C0E;
    --surface: #121316;
    --surface-2: #17181C;
    --border: #232529;
    --border-soft: #1B1D21;
    --text: #E9E9EC;
    --text-muted: #7F8087;
    --text-faint: #5A5B61;
    --accent: #F0A83C;
    --success: #3ECF8E;
    --danger: #F0708A;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 24px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  .plat-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .plat-youtube { background: #3b1f22; color: #ff6b6b; }
  .plat-reddit { background: #1f2a3b; color: #7fb0ff; }
  .src-link { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
  .src-link:hover { color: var(--accent); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.muted, .muted { color: var(--text-muted); }
  .table-scroll { overflow-x: auto; }
  .table-scroll table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-scroll th { text-align: left; color: var(--text-faint); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .table-scroll td { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  /* New-data banner */
  #data-banner {
    display: none; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px;
    font-size: 13px; color: var(--text-muted);
  }
  #data-banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex: none; }
  #data-banner strong { color: var(--text); font-weight: 500; }


  /* Masthead: plain editorial, no buttons-as-pills */
  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 20px; margin-bottom: 4px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 24px; margin: 0; letter-spacing: -0.02em; line-height: 1;
  }
  h1 a { color: inherit; text-decoration: none; }
  .sub { color: var(--text-muted); font-size: 13px; margin: 6px 0 0; }
  .nav-links { display: flex; gap: 18px; margin-top: 6px; }
  .nav-links a {
    color: var(--text-muted); font-size: 13px; text-decoration: none;
    border-bottom: 1px solid transparent; padding-bottom: 1px;
  }
  .nav-links a:hover { color: var(--text); border-bottom-color: var(--text-muted); }
  select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 14px;
    padding: 7px 12px; border-radius: 8px; min-width: 190px; font-size: 13px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .header-controls { display: flex; gap: 10px; align-items: center; }

  /* Summary: one asymmetric strip. Big numeral left, plain stat rows right. */
  .summary {
    display: grid; grid-template-columns: 300px 1fr;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); margin-top: 20px; overflow: hidden;
  }
  @media (max-width: 760px) { .summary { grid-template-columns: 1fr; } }
  .summary-hero {
    padding: 20px 22px; border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column; justify-content: center;
  }
  @media (max-width: 760px) { .summary-hero { border-right: none; border-bottom: 1px solid var(--border-soft); } }
  .summary-hero .platform { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .big-score {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600;
    font-size: 46px; line-height: 1; letter-spacing: -0.04em;
  }
  .summary-hero .of { font-size: 12px; color: var(--text-faint); margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }
  .summary-hero .note { font-size: 12px; color: var(--text-muted); margin-top: 10px; line-height: 1.55; }
  .summary-rows { display: flex; flex-direction: column; }
  .summary-row {
    display: grid; grid-template-columns: 140px 1fr 100px 90px;
    align-items: center; gap: 16px;
    padding: 10px 20px; font-size: 13px;
  }
  .summary-row + .summary-row { border-top: 1px solid var(--border-soft); }
  @media (max-width: 640px) { .summary-row { grid-template-columns: 120px 1fr; } .summary-row .pos, .summary-row .q { display: none; } }
  .summary-row .platform { color: var(--text); font-weight: 500; }
  .summary-row .bar-track { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .summary-row .bar-fill { height: 100%; border-radius: 2px; }
  .summary-row .score, .summary-row .pos, .summary-row .q {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-muted); text-align: right;
  }
  .summary-row .score { color: var(--text); font-weight: 600; }

  /* Sections: quiet, no card-in-card noise */
  section.block { margin-top: 26px; }
  .block-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 14px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .block-head h2 {
    font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 500;
    margin: 0; letter-spacing: -0.01em;
  }
  .block-head .hint { font-size: 12.5px; color: var(--text-faint); }
  .inner {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  }

  /* Chart + co-mentions pair */
  .pair { display: grid; grid-template-columns: 1.35fr 1fr; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  .pair > div { padding: 16px 20px; }
  .pair > div:first-child { border-right: 1px solid var(--border-soft); }
  @media (max-width: 760px) { .pair > div:first-child { border-right: none; border-bottom: 1px solid var(--border-soft); } }
  .chart-box { height: 180px; margin-top: 10px; }
  .mini-head { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Mentions & sources: plain ranked list, no avatars, no chips */
  .rank-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .rank-list li {
    display: flex; align-items: baseline; gap: 12px;
    padding: 6px 0; font-size: 13px;
  }
  .rank-list li + li { border-top: 1px solid var(--border-soft); }
  .rank-list .n {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--text-faint); width: 18px; flex-shrink: 0; text-align: right;
  }
  .rank-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-list .count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); }
  .list-empty { color: var(--text-muted); font-size: 13px; padding: 18px 0 6px; margin: 0; }

  /* Query table: hairlines only where they carry meaning */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; color: var(--text-faint); font-weight: 500;
    padding: 9px 14px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; border-bottom: 1px solid var(--border);
  }
  td { padding: 8px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr.row:hover { background: var(--surface-2); cursor: pointer; }
  .plat { font-size: 12px; font-weight: 500; white-space: nowrap; }
  .date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .query-cell { max-width: 380px; }
  .num { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
  .detail { display: none; background: var(--surface-2); }
  .detail.open { display: table-row; }
  .detail td { color: var(--text-muted); font-size: 12.5px; line-height: 1.6; padding: 14px 16px; }
  .detail h4 { color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px; }
  .detail section { margin-bottom: 16px; }
  .detail section:last-child { margin-bottom: 0; }
  .tag { display: inline-block; margin: 2px 6px 2px 0; color: var(--text-muted); font-size: 12px; }
  .tag:not(:last-child)::after { content: ','; }
  .empty { color: var(--text-muted); text-align: center; padding: 44px 0; font-size: 13.5px; }

  /* Shopify sections */
  .section-details { border-bottom: 1px solid var(--border-soft); }
  .section-details:last-child { border-bottom: none; }
  .section-details summary {
    cursor: pointer; padding: 10px 18px; list-style: none;
    display: flex; align-items: baseline; gap: 10px;
  }
  .section-details summary::-webkit-details-marker { display: none; }
  .section-details summary:hover { background: var(--surface-2); }
  .section-details summary .s-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .section-details summary .section-meta { color: var(--text-faint); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .table-scroll { overflow-x: auto; padding: 0 18px 14px; }
  /* Queries dropdown */
  .queries-details { border-bottom: none; }
  .queries-details summary {
    cursor: pointer; padding: 10px 18px; list-style: none;
    display: flex; align-items: baseline; gap: 10px;
  }
  .queries-details summary::-webkit-details-marker { display: none; }
  .queries-details summary:hover { background: var(--surface-2); }
  .queries-details summary .s-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .queries-details summary .section-meta { color: var(--text-faint); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .queries-details summary::after {
    content: '+'; margin-left: auto; color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  }
  .queries-details[open] summary::after { content: '–'; }
  .queries-details[open] summary { border-bottom: 1px solid var(--border-soft); }
  /* Shopify dropdown */
  .shopify-details summary, .shopify-details { border-bottom: none; }
  .shopify-details summary {
    cursor: pointer; padding: 10px 18px; list-style: none;
    display: flex; align-items: baseline; gap: 10px;
  }
  .shopify-details summary::-webkit-details-marker { display: none; }
  .shopify-details summary:hover { background: var(--surface-2); }
  .shopify-details summary .s-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .shopify-details summary .section-meta { color: var(--text-faint); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .shopify-details summary::after {
    content: '+'; margin-left: auto; color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  }
  .shopify-details[open] summary::after { content: '–'; }
  .shopify-details[open] summary { border-bottom: 1px solid var(--border-soft); }
  .table-scroll table { min-width: 100%; font-size: 12.5px; }
  .table-scroll th, .table-scroll td { white-space: nowrap; padding-left: 0; }
  .table-scroll th:last-child, .table-scroll td:last-child { padding-right: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><a href="/">AI visibility</a></h1>
      <div class="nav-links">
        <a href="/reports.html">Weekly reports</a>
        <a href="/upload.html">Upload data</a>
      </div>
    </div>
    <div class="header-controls">
      <select id="client-select"><option>Loading clients…</option></select>
    </div>
  </header>
  <div id="data-banner"><span class="dot"></span><span id="data-banner-text"></span></div>
  <div id="content"><div class="empty">Loading…</div></div>
</div>

<script>
const PLATFORM_COLORS = {
  google_ai_mode: '#4C8DFF',
  chatgpt: '#3ECF8E',
  perplexity: '#A78BFA',
};
const PLATFORM_LABELS = {
  google_ai_mode: 'Google AI Mode',
  chatgpt: 'ChatGPT',
  perplexity: 'Perplexity',
};

function platformColor(p) { return PLATFORM_COLORS[p] || '#6B7280'; }
function platformLabel(p) {
  return PLATFORM_LABELS[p] || p.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}
function sourceDomain(entry) {
  const url = (entry && typeof entry === 'object') ? entry.url : entry;
  if (!url) return '';
  try {
    const host = new URL(url).hostname.toLowerCase();
    return host.startsWith('www.') ? host.slice(4) : host;
  } catch {
    return '';
  }
}
function uniqueDomains(sources) {
  const set = new Set();
  for (const s of (sources || [])) {
    const d = sourceDomain(s);
    if (d) set.add(d);
  }
  return [...set].sort();
}

let chart;

async function loadClients() {
  const res = await fetch('/api/clients');
  const clients = await res.json();
  const select = document.getElementById('client-select');
  if (!clients.length) {
    select.innerHTML = '<option>No clients yet</option>';
    document.getElementById('content').innerHTML = '<div class="empty">No clients loaded yet - run ingest_ai_visibility.py first.</div>';
    return;
  }
  select.innerHTML = clients.map(c => `<option value="${c.slug}">${c.name}</option>`).join('');
  select.addEventListener('change', () => loadClient(select.value));
  loadClient(select.value);
}

/* Asymmetric summary: best platform gets the hero numeral, the rest
   are compact rows with a hairline score bar. */
function summaryHtml(summary) {
  const ranked = [...summary].sort((a, b) => (b.avg_visibility_score ?? 0) - (a.avg_visibility_score ?? 0));
  const [best, ...rest] = ranked;
  const bestColor = platformColor(best.platform);

  const rows = rest.map(s => {
    const color = platformColor(s.platform);
    const pct = Math.max(0, Math.min(100, s.avg_visibility_score ?? 0));
    return `
    <div class="summary-row">
      <span class="platform">${platformLabel(s.platform)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${color}"></span></span>
      <span class="score">${s.avg_visibility_score ?? '—'}</span>
      <span class="q">${s.queries_tested} queries</span>
    </div>`;
  }).join('');

  return `
  <div class="summary">
    <div class="summary-hero">
      <p class="platform">${platformLabel(best.platform)}</p>
      <div class="big-score" style="color:${bestColor}">${best.avg_visibility_score ?? '—'}</div>
      <p class="of">out of 100 visibility</p>
      <p class="note">Avg position ${best.avg_brand_position ?? '—'} across ${best.queries_tested} queries. ${best.presence_rate ?? '—'}% of answers mentioned the brand.</p>
    </div>
    <div class="summary-rows">${rows}</div>
  </div>`;
}

function rankList(items, emptyMessage) {
  if (!items.length) return `<p class="list-empty">${emptyMessage}</p>`;
  return `<ol class="rank-list">${items.map((m, i) => `
    <li>
      <span class="n">${i + 1}</span>
      <span class="name">${escapeHtml(m.name)}</span>
      <span class="count">${m.count}</span>
    </li>`).join('')}</ol>`;
}

function aiVisibilityHtml(summary, queries, mentions, topSources) {
  if (!summary.length) {
    return `<section class="block"><div class="inner"><p class="empty">No AI visibility data yet for this client.</p></div></section>`;
  }

  const mentionsHtml = rankList(mentions, 'No other brands showed up alongside this client yet.');
  const sourcesHtml = rankList(topSources, 'No sources captured yet for this client.');

  const rows = queries.map((q, i) => {
    const domains = uniqueDomains(q.sources);
    return `
    <tr class="row" onclick="toggleDetail(${i})">
      <td><span class="plat" style="color:${platformColor(q.platform)}">${platformLabel(q.platform)}</span></td>
      <td class="date">${q.check_date}</td>
      <td class="query-cell">${escapeHtml(q.query_text)}</td>
      <td class="num">${q.visibility_score ?? '—'}</td>
      <td class="num">${q.brand_position ?? '—'} / ${q.total_brands ?? '—'}</td>
    </tr>
    <tr class="detail" id="detail-${i}">
      <td colspan="5">
        ${q.mentions && q.mentions.length ? `<section><h4>Mentioned</h4>${q.mentions.map(m => `<span class="tag">${escapeHtml(m)}</span>`).join('')}</section>` : ''}
        ${q.competitor_analysis ? `<section><h4>Competitor analysis</h4>${escapeHtml(q.competitor_analysis)}</section>` : ''}
        ${domains.length ? `<section><h4>Cited sources</h4>${domains.map(d => `<span class="tag">${escapeHtml(d)}</span>`).join('')}</section>` : ''}
        ${q.related_queries && q.related_queries.length ? `<section><h4>Related queries</h4>${q.related_queries.map(rq => `<span class="tag">${escapeHtml(rq)}</span>`).join('')}</section>` : ''}
        ${q.raw_output ? `<section><h4>Raw response</h4>${escapeHtml(q.raw_output)}</section>` : ''}
      </td>
    </tr>
  `;
  }).join('');

  return `
    ${summaryHtml(summary)}
    <section class="block">
      <div class="pair inner">
        <div>
          <p class="mini-head">Score by platform</p>
          <div class="chart-box"><canvas id="chart"></canvas></div>
        </div>
        <div>
          <p class="mini-head">Mentioned alongside</p>
          ${mentionsHtml}
        </div>
      </div>
    </section>
    <section class="block">
      <div class="block-head">
        <h2>Most cited sources</h2>
        <span class="hint">domains the AI cited most, across all answers</span>
      </div>
      <div class="inner" style="padding: 4px 20px 12px">${sourcesHtml}</div>
    </section>
    <section class="block">
      <div class="block-head">
        <h2>Queries tested</h2>
        <span class="hint">click a query to expand the full response</span>
      </div>
      <div class="inner">
        ${queriesHtml(queries, rows)}
      </div>
    </section>
  `;
}

/* Queries as an expandable list. Collapsed by default (shows platform,
   date, query, score); expanding reveals the full AI response detail. */
function queriesHtml(queries, rows) {
  if (!queries.length) {
    return '<p class="list-empty">No queries tested yet for this client.</p>';
  }
  return `
    <details class="queries-details" open>
      <summary>
        <span class="s-name">All queries</span>
        <span class="section-meta">${queries.length} quer${queries.length === 1 ? 'y' : 'ies'}</span>
      </summary>
      <div class="queries-body">
        <table>
          <thead><tr><th>Platform</th><th>Date</th><th>Query</th><th>Score</th><th>Position</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </details>`;
}

function renderChart(summary) {
  if (chart) { chart.destroy(); chart = null; }
  if (!summary.length) return;
  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels: summary.map(s => platformLabel(s.platform)),
      datasets: [{
        data: summary.map(s => s.avg_visibility_score),
        backgroundColor: summary.map(s => platformColor(s.platform)),
        borderRadius: 3,
        maxBarThickness: 22,
        barPercentage: 0.6,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { min: 0, max: 100, grid: { color: '#1B1D21' }, ticks: { color: '#5A5B61', font: { size: 11 } } },
        y: { grid: { display: false }, ticks: { color: '#E9E9EC', font: { size: 12.5 } } },
      },
    },
  });
}

function sectionTable(s) {
  const cols = s.columns || [];
  const rows = s.rows || [];
  return `
    <details class="section-details" open>
      <summary><span class="s-name">${escapeHtml(s.section_name)}</span><span class="section-meta">${rows.length} row${rows.length === 1 ? '' : 's'}</span></summary>
      <div class="table-scroll">
        <table>
          <thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(r => `<tr>${r.map(v => `<td>${escapeHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    </details>`;
}

function shopifyReportHtml(sections) {
  if (!sections.length) {
    return `<section class="block">
      <div class="block-head"><h2>Shopify report</h2></div>
      <div class="inner"><p class="empty">No Shopify report uploaded yet for this client.</p></div>
    </section>`;
  }

  // Sections arrive grouped by report_period already (monthly first, then
  // each weekly period in upload order) - just split on period changes.
  const groups = [];
  for (const s of sections) {
    const last = groups[groups.length - 1];
    if (!last || last.period !== s.report_period) {
      groups.push({ period: s.report_period, sections: [] });
    }
    groups[groups.length - 1].sections.push(s);
  }

  return groups.map(g => `
    <section class="block">
      <div class="block-head">
        <h2>Shopify report</h2>
        <span class="hint">${g.period ? escapeHtml(g.period) : 'monthly'}</span>
      </div>
      <div class="inner">
        <details class="shopify-details">
          <summary>
            <span class="s-name">Report sections</span>
            <span class="section-meta">${g.sections.length} section${g.sections.length === 1 ? '' : 's'}</span>
          </summary>
          <div class="shopify-body">${g.sections.map(sectionTable).join('')}</div>
        </details>
      </div>
    </section>
  `).join('');
}

/* Research panel: YouTube/Reddit sources + top comments */
function researchHtml(stats, sources, comments) {
  if (!stats.sources) {
    return `<section class="block">
      <div class="block-head"><h2>Research (YouTube &amp; Reddit)</h2></div>
      <div class="inner"><p class="empty">No research sources ingested yet for this client.</p></div>
    </section>`;
  }

  const platformTag = p => p === 'youtube' ? 'YouTube' : p === 'reddit' ? 'Reddit' : escapeHtml(p);
  const srcRows = sources.map(v => `
    <tr>
      <td><span class="plat-tag plat-${escapeHtml(v.platform)}">${platformTag(v.platform)}</span></td>
      <td><a class="src-link" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">${escapeHtml(v.title || v.url)}</a></td>
      <td class="num">${v.comment_count}</td>
      <td class="muted">${v.published_at ? escapeHtml(String(v.published_at).slice(0, 10)) : '&mdash;'}</td>
    </tr>`).join('');

  const comRows = comments.map(c => {
    const body = (c.body || '').slice(0, 240);
    return `
    <tr>
      <td class="muted">${escapeHtml(c.author || 'unknown')}</td>
      <td class="num">${c.score ?? '&mdash;'}</td>
      <td>${escapeHtml(body)}${(c.body || '').length > 240 ? '&hellip;' : ''}</td>
      <td class="muted">${escapeHtml(c.source_title || '')}</td>
    </tr>`;
  }).join('');

  const plats = (stats.platforms || []).map(p => `${platformTag(p.platform)}: ${p.n}`).join(' &middot; ');

  return `
    <section class="block">
      <div class="block-head">
        <h2>Research (YouTube &amp; Reddit)</h2>
        <span class="hint">${stats.sources} sources &middot; ${stats.comments} comments &middot; ${plats}</span>
      </div>
      <div class="inner">
        <details class="shopify-details" open>
          <summary><span class="s-name">Recent sources</span><span class="section-meta">latest ${sources.length}</span></summary>
          <div class="shopify-body">
            <div class="table-scroll"><table>
              <thead><tr><th>Platform</th><th>Video / thread</th><th>Comments</th><th>Published</th></tr></thead>
              <tbody>${srcRows}</tbody>
            </table></div>
          </div>
        </details>
        <details class="shopify-details">
          <summary><span class="s-name">Top comments by upvotes</span><span class="section-meta">top ${comments.length}</span></summary>
          <div class="shopify-body">
            <div class="table-scroll"><table>
              <thead><tr><th>Author</th><th>Score</th><th>Comment</th><th>On</th></tr></thead>
              <tbody>${comRows}</tbody>
            </table></div>
          </div>
        </details>
      </div>
    </section>`;
}

async function loadClient(slug) {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty">Loading…</div>';

  const [summaryRes, queriesRes, mentionsRes, sourcesRes, shopifyRes, rstatsRes, rsourcesRes, rcommentsRes] = await Promise.all([
    fetch(`/api/summary?client=${encodeURIComponent(slug)}`),
    fetch(`/api/queries?client=${encodeURIComponent(slug)}`),
    fetch(`/api/mentions?client=${encodeURIComponent(slug)}`),
    fetch(`/api/top-sources?client=${encodeURIComponent(slug)}`),
    fetch(`/api/shopify-report?client=${encodeURIComponent(slug)}`),
    fetch(`/api/research-stats?client=${encodeURIComponent(slug)}`),
    fetch(`/api/research-sources?client=${encodeURIComponent(slug)}`),
    fetch(`/api/research-comments?client=${encodeURIComponent(slug)}`),
  ]);
  const summary = await summaryRes.json();
  const queries = await queriesRes.json();
  const mentions = await mentionsRes.json();
  const topSources = await sourcesRes.json();
  const shopifySections = await shopifyRes.json();
  const rstats = await rstatsRes.json();
  const rsources = await rsourcesRes.json();
  const rcomments = await rcommentsRes.json();

  if (!summary.length && !shopifySections.length) {
    content.innerHTML = '<div class="empty">No data yet for this client.</div>';
    return;
  }

  content.innerHTML = aiVisibilityHtml(summary, queries, mentions, topSources)
    + researchHtml(rstats, rsources, rcomments)
    + shopifyReportHtml(shopifySections);
  renderChart(summary);
}

function toggleDetail(i) {
  document.getElementById(`detail-${i}`).classList.toggle('open');
}

// --- Init ---

// --- New-data banner ---
let lastIngestSeen = null;

function fmtWhen(iso) {
  const d = new Date(iso);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const h = Math.round(mins / 60);
  if (h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}

async function checkIngest(initial = false) {
  try {
    const res = await fetch('/api/latest-ingest');
    const data = await res.json();
    if (!data.latest) return;
    const t = new Date(data.latest).getTime();
    if (lastIngestSeen === null) {
      lastIngestSeen = t;
    } else if (t > lastIngestSeen) {
      lastIngestSeen = t;
      showBanner('New data was just added to the hub.');
    } else if (!initial) {
      // keep existing banner if shown
    }
    if (t > lastIngestSeen - 30 * 60000) {
      showBanner('Last data added ' + fmtWhen(data.latest) + '.');
    }
  } catch (e) { /* silent */ }
}

function showBanner(text) {
  const el = document.getElementById('data-banner');
  document.getElementById('data-banner-text').innerHTML = text;
  el.style.display = 'flex';
}

checkIngest(true);
setInterval(checkIngest, 5 * 60 * 1000);

// --- Init ---
loadClients();
</script>
